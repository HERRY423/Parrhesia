[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parrhesia-review"
version = "0.1.0"
description = "Independent evidence reviews and explicit, traceable adjudication for agent plugins"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
parrhesia = "parrhesia.cli:main"

[tool.setuptools]
packages = ["parrhesia"]

[tool.setuptools.data-files]
"share/parrhesia" = ["docs/contract.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
